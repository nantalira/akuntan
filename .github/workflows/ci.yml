name: CI (Development)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint and Format Check (Biome)
        run: bun run check

      - name: Build Frontend SPA
        run: bun run build
